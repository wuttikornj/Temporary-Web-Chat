<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study request consult</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --line: #e3e6ea; --ink: #1a1d21;
    --muted: #6b7280; --accent: #1f6feb; --mine: #1f6feb; --theirs: #eef0f3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 16px; }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; margin-bottom: 16px;
  }
  .card h2 {
    margin: 0; padding: 14px 18px; font-size: 14px; font-weight: 600;
    border-bottom: 1px solid var(--line); color: var(--muted);
    text-transform: uppercase; letter-spacing: .04em;
  }
  .summary { padding: 6px 18px 14px; }
  .row { display: flex; gap: 14px; padding: 7px 0; border-bottom: 1px solid #f1f2f4; }
  .row:last-child { border-bottom: 0; }
  .row .k { flex: 0 0 130px; color: var(--muted); font-size: 13px; }
  .row .v { flex: 1; white-space: pre-wrap; }
  .hn { font-family: ui-monospace, Menlo, monospace; }
  .meta { padding: 10px 18px; font-size: 13px; color: var(--muted); }
  #log { padding: 14px 18px; min-height: 220px; max-height: 50vh; overflow-y: auto; }
  .msg { margin-bottom: 12px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 78%; padding: 9px 13px; border-radius: 14px;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.user .bubble { background: var(--mine); color: #fff; border-bottom-right-radius: 4px; }
  .msg.admin .bubble { background: var(--theirs); border-bottom-left-radius: 4px; }
  .stamp { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .msg.user .stamp { text-align: right; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; font-size: 14px; }
  .notice {
    margin: 0; padding: 11px 18px; background: #f0f6ff; color: #1f4b8f;
    font-size: 13.5px; line-height: 1.45; border-bottom: 1px solid #dbe7fb;
  }
  .notice strong { font-weight: 600; }
  form { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
  textarea {
    flex: 1; resize: none; border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 11px; font: inherit; min-height: 42px; max-height: 140px;
  }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 0 18px; font: inherit; font-weight: 500; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .err { color: #b42318; padding: 10px 18px; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h2>Request details</h2>
    <div class="summary" id="summary"></div>
    <div class="meta" id="meta"></div>
  </div>

  <div class="card">
    <h2>Conversation</h2>
    <p class="notice">
      <strong>No need to wait around!</strong>
      Close this chat if you like. If the resident replies and you haven’t
      opened it within <span id="delay">5</span> minutes, we’ll email you a
      direct link to rejoin.
    </p>
    <div id="log"><div class="empty">Loading…</div></div>
    <div class="err" id="err" hidden></div>
    <form id="composer">
      <textarea id="body" placeholder="Write a message…" rows="1"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </div>
</div>

<script>
const TOKEN = location.pathname.split("/").pop();
const API = `/api/v1/chat/${TOKEN}`;
let lastCount = -1;

const el = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const time = iso => new Date(iso + "Z").toLocaleString([], {
  day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

function renderSummary(data) {
  el("summary").innerHTML =
    `<div class="row"><div class="k">HN</div><div class="v hn">${esc(data.hn)}</div></div>` +
    data.summary.map(f =>
      `<div class="row"><div class="k">${esc(f.label)}</div><div class="v">${esc(f.value)}</div></div>`
    ).join("");
  el("meta").textContent =
    `Station: ${data.station}  ·  Expires ${time(data.expires_at)}`;
}

function renderMessages(messages) {
  const log = el("log");
  if (!messages.length) {
    log.innerHTML = '<div class="empty">No replies yet. A radiologist will respond here.</div>';
    return;
  }
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  log.innerHTML = messages.map(m => `
    <div class="msg ${m.sender_type}">
      <div>
        <div class="bubble">${esc(m.body)}</div>
        <div class="stamp">${m.sender_type === "user" ? "You" : "Radiology"} · ${time(m.sent_at)}</div>
      </div>
    </div>`).join("");
  if (atBottom) log.scrollTop = log.scrollHeight;
}

async function load() {
  try {
    const res = await fetch(API);
    if (!res.ok) throw new Error(res.status === 404
      ? "This chat link is not valid, or the conversation has expired."
      : `Could not load the conversation (${res.status})`);
    const data = await res.json();
    el("err").hidden = true;
    // Read the delay from the API so this never contradicts the server.
    if (data.notify_after_minutes) el("delay").textContent = data.notify_after_minutes;
    renderSummary(data);
    if (data.messages.length !== lastCount) {
      renderMessages(data.messages);
      lastCount = data.messages.length;
    }
  } catch (e) {
    el("err").hidden = false;
    el("err").textContent = e.message;
  }
}

el("composer").addEventListener("submit", async ev => {
  ev.preventDefault();
  const body = el("body").value.trim();
  if (!body) return;
  el("send").disabled = true;
  try {
    const res = await fetch(`${API}/messages`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ body }),
    });
    if (!res.ok) throw new Error("Message not sent. Please try again.");
    el("body").value = "";
    lastCount = -1;
    await load();
  } catch (e) {
    el("err").hidden = false;
    el("err").textContent = e.message;
  } finally {
    el("send").disabled = false;
  }
});

el("body").addEventListener("keydown", ev => {
  if (ev.key === "Enter" && !ev.shiftKey) {
    ev.preventDefault();
    el("composer").requestSubmit();
  }
});

load();
// Polling, not WebSockets. Phase 5 replaces this and nothing else changes.
setInterval(load, 4000);
</script>
</body>
</html>
