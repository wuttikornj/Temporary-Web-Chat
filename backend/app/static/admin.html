<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consult queue</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --line: #e3e6ea; --ink: #1a1d21;
    --muted: #6b7280; --accent: #1f6feb; --unread: #b42318;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); height: 100vh;
    display: flex; flex-direction: column;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  header {
    background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 10px 16px; display: flex; gap: 12px; align-items: center;
  }
  header strong { font-size: 15px; }
  header input, header select {
    border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; font: inherit;
  }
  header .spacer { flex: 1; }
  main { flex: 1; display: flex; min-height: 0; }
  #queue {
    width: 340px; border-right: 1px solid var(--line); background: var(--panel);
    overflow-y: auto;
  }
  .item { padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:hover { background: #f9fafb; }
  .item.active { background: #eef4ff; }
  .item .top { display: flex; justify-content: space-between; gap: 8px; }
  .item .name { font-weight: 500; }
  .item .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .badge {
    background: var(--unread); color: #fff; border-radius: 10px;
    padding: 1px 7px; font-size: 12px; font-weight: 600; align-self: flex-start;
  }
  #thread { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #detail { overflow-y: auto; flex: 1; padding: 16px; }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; margin-bottom: 16px;
  }
  .card h2 {
    margin: 0; padding: 12px 16px; font-size: 13px; font-weight: 600;
    border-bottom: 1px solid var(--line); color: var(--muted);
    text-transform: uppercase; letter-spacing: .04em;
  }
  .summary { padding: 6px 16px 12px; }
  .row { display: flex; gap: 14px; padding: 6px 0; border-bottom: 1px solid #f1f2f4; }
  .row:last-child { border-bottom: 0; }
  .row .k { flex: 0 0 130px; color: var(--muted); font-size: 13px; }
  .row .v { flex: 1; white-space: pre-wrap; }
  .hn { font-family: ui-monospace, Menlo, monospace; }
  .msgs { padding: 14px 16px; }
  .msg { margin-bottom: 12px; display: flex; }
  .msg.admin { justify-content: flex-end; }
  .bubble { max-width: 78%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.admin .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.user .bubble { background: #eef0f3; border-bottom-left-radius: 4px; }
  .stamp { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .msg.admin .stamp { text-align: right; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--panel); }
  textarea {
    flex: 1; resize: none; border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 11px; font: inherit; min-height: 42px; max-height: 140px;
  }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 0 18px; font: inherit; font-weight: 500; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .empty { color: var(--muted); text-align: center; padding: 60px 20px; }
</style>
</head>
<body>
<header>
  <strong>Consult queue</strong>
  <select id="station">
    <option value="">All stations</option>
  </select>
  <div class="spacer"></div>
  <input id="admin" placeholder="your email" size="24">
</header>

<main>
  <div id="queue"></div>
  <div id="thread">
    <div id="detail"><div class="empty">Select a request from the queue.</div></div>
  </div>
</main>

<script>
const STATIONS = ["Neuro","Chest","CVS","Abdomen","MSK","Ultrasound","PED","Manual sort"];
let current = null, lastCount = -1;

const el = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const time = iso => new Date(iso + "Z").toLocaleString([], {
  day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

// Identity is a stub until Phase 9 replaces it with real admin auth.
function headers() {
  return { "X-Admin-Email": el("admin").value || "resident@example.com" };
}

STATIONS.forEach(s => {
  const o = document.createElement("option");
  o.value = o.textContent = s;
  el("station").appendChild(o);
});

async function loadQueue() {
  const q = el("station").value ? `?station=${encodeURIComponent(el("station").value)}` : "";
  const res = await fetch(`/api/v1/admin/requests${q}`, { headers: headers() });
  if (!res.ok) {
    el("queue").innerHTML = `<div class="empty">Could not load the queue (${res.status})</div>`;
    return;
  }
  const rows = await res.json();
  if (!rows.length) {
    el("queue").innerHTML = '<div class="empty">Nothing waiting.</div>';
    return;
  }
  el("queue").innerHTML = rows.map(r => `
    <div class="item ${r.request_id === current ? "active" : ""}" data-id="${r.request_id}">
      <div class="top">
        <span class="name">${esc(r.patient_name || "(no name)")}</span>
        ${r.unread_count ? `<span class="badge">${r.unread_count}</span>` : ""}
      </div>
      <div class="sub hn">${esc(r.hn)} · ${esc(r.station)}</div>
      <div class="sub">${esc(r.modality || "")} ${esc(r.study || "")}</div>
      <div class="sub">${time(r.created_at)}</div>
    </div>`).join("");
  document.querySelectorAll(".item").forEach(n =>
    n.onclick = () => { current = n.dataset.id; lastCount = -1; loadThread(); loadQueue(); });
}

async function loadThread() {
  if (!current) return;
  const res = await fetch(`/api/v1/admin/requests/${current}`, { headers: headers() });
  if (!res.ok) {
    el("detail").innerHTML = `<div class="empty">Could not load (${res.status})</div>`;
    return;
  }
  const d = await res.json();
  if (d.messages.length === lastCount) return;
  lastCount = d.messages.length;

  el("thread").innerHTML = `
    <div id="detail">
      <div class="card">
        <h2>Request details</h2>
        <div class="summary">
          <div class="row"><div class="k">HN</div><div class="v hn">${esc(d.hn)}</div></div>
          ${d.summary.map(f =>
            `<div class="row"><div class="k">${esc(f.label)}</div><div class="v">${esc(f.value)}</div></div>`
          ).join("")}
        </div>
      </div>
      <div class="card">
        <h2>Conversation</h2>
        <div class="msgs">${
          d.messages.length
            ? d.messages.map(m => `
              <div class="msg ${m.sender_type}">
                <div>
                  <div class="bubble">${esc(m.body)}</div>
                  <div class="stamp">${m.sender_type === "admin" ? "You" : "Requesting doctor"} · ${time(m.sent_at)}</div>
                </div>
              </div>`).join("")
            : '<div class="empty">No messages yet. Your reply starts the conversation.</div>'
        }</div>
      </div>
    </div>
    <form id="composer">
      <textarea id="body" placeholder="Reply to the requesting doctor…"></textarea>
      <button id="send" type="submit">Send</button>
    </form>`;

  el("composer").addEventListener("submit", async ev => {
    ev.preventDefault();
    const body = el("body").value.trim();
    if (!body) return;
    el("send").disabled = true;
    const res = await fetch(`/api/v1/admin/requests/${current}/messages`, {
      method: "POST",
      headers: { ...headers(), "Content-Type": "application/json" },
      body: JSON.stringify({ body }),
    });
    el("send").disabled = false;
    if (res.ok) { lastCount = -1; loadThread(); loadQueue(); }
  });

  el("body").addEventListener("keydown", ev => {
    if (ev.key === "Enter" && !ev.shiftKey) {
      ev.preventDefault();
      el("composer").requestSubmit();
    }
  });

  const d2 = el("detail");
  d2.scrollTop = d2.scrollHeight;
}

el("station").onchange = loadQueue;
el("admin").onchange = () => { loadQueue(); loadThread(); };

loadQueue();
setInterval(() => { loadQueue(); loadThread(); }, 4000);
</script>
</body>
</html>
